spring.application.name=backend

spring.datasource.url=${WITHWON_DB_URL:jdbc:mysql://localhost:3306/withwon?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${WITHWON_DB_USERNAME:withwon}
spring.datasource.password=${WITHWON_DB_PASSWORD:withwon}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

withwon.auth.jwt-secret=${WITHWON_JWT_SECRET:}
withwon.auth.jwt-expiration-seconds=${WITHWON_JWT_EXPIRATION_SECONDS:3600}
withwon.evidence.storage-root=${WITHWON_EVIDENCE_STORAGE_ROOT:./storage/evidence}
