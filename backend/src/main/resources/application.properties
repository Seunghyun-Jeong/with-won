spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${WITHWON_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:withwon}?sslMode=REQUIRED&connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${WITHWON_DB_USERNAME:${DB_USERNAME:withwon}}
spring.datasource.password=${WITHWON_DB_PASSWORD:${DB_PASSWORD:withwon}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

withwon.auth.jwt-secret=${WITHWON_JWT_SECRET:}
withwon.auth.jwt-expiration-seconds=${WITHWON_JWT_EXPIRATION_SECONDS:3600}
withwon.evidence.storage-root=${WITHWON_EVIDENCE_STORAGE_ROOT:./storage/evidence}
