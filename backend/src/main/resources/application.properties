spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${WITHWON_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:withwon}?sslMode=REQUIRED&connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${WITHWON_DB_USERNAME:${DB_USERNAME:withwon}}
spring.datasource.password=${WITHWON_DB_PASSWORD:${DB_PASSWORD:withwon}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration

withwon.auth.jwt-secret=${WITHWON_JWT_SECRET:}
withwon.auth.jwt-expiration-seconds=${WITHWON_JWT_EXPIRATION_SECONDS:3600}
withwon.evidence.storage-root=${WITHWON_EVIDENCE_STORAGE_ROOT:./storage/evidence}
# 키는 실행 위치(backend 폴더)의 .env(git에 안 올림, .env.example 참고)나 환경변수로 넣는다. 둘 다 있으면 환경변수가 이긴다.
spring.config.import=optional:file:.env[.properties]

# CLOVA OCR General. 키가 없어도 앱은 뜨고, OCR을 부를 때 ClovaOcrClient가 막는다.
ocr.api.url=${OCR_API_URL:}
ocr.api.key=${OCR_API_KEY:}

# CLOVA Speech 장문 인식. 키가 없어도 앱은 뜨고, 녹음을 읽을 때 ClovaSpeechClient가 막는다.
speech.api.url=${SPEECH_API_URL:}
speech.api.key=${SPEECH_API_KEY:}
