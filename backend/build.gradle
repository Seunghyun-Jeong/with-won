plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.3'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.withwon'
version = '0.0.1-SNAPSHOT'
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'com.anthropic:anthropic-java:3.3.0'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'clova', 'llm'
	}
}

// 진짜 CLOVA를 부르는 시험(@Tag("clova")). 키가 .env에 늘 있으므로 ./gradlew test에서는 빼고, 돈과 시간이 드는 호출은 이걸로만 한다.
tasks.register('clovaTest', Test) {
	description = '진짜 CLOVA(OCR, Speech)로 김우리 서류와 녹음을 읽는다. backend/.env에 키가 있어야 한다. 하나만: --tests \'*KimWooriSpeechRun\''
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'clova'
	}
	outputs.upToDateWhen { false }
}

// 진짜 LLM(Claude)을 부르는 시험(@Tag("llm")). clovaTest와 같은 이유로 ./gradlew test에서 빼고 이걸로만 돌린다.
tasks.register('llmTest', Test) {
	description = '진짜 Claude로 김우리 사건 타임라인과 요약을 만든다. backend/.env에 ANTHROPIC_API_KEY가 있어야 한다. 하나만: --tests \'*KimWooriLlmRun.김우리_사건_요약*\'. 결과는 build/llm-timeline-kim-woori/, build/llm-summary-kim-woori/'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'llm'
	}
	testLogging.showStandardStreams = true
	outputs.upToDateWhen { false }
}
